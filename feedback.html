 <!DOCTYPE html>
    <html lang="sv">
    <head>
        <link rel="stylesheet" href="lab1.css">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Min portfolio</title>
    </head> 

   <body>
        <header>
            <div class="row">
                <h5>Min Portfolio</h5>
                <nav>
                    <a class="nav-lank" href="lab1.html">Startsida</a>
                    <a class="nav-lank" href="lab1.html">Tidigare arbeten</a>
                    <a class="nav-lank" href="lab1.html">Om mig</a>
                    <a class="nav-lank" href="feedback.html">Feedback</a>
                </nav>
            </div>
        </header>
    
 
        <section id="feedback-form">
            <h2>Feedback om min portfolio</h2>
            <div class="mail-section">
                <form action="mailto:lukas.lindinger@hotmail.com" method="post" enctype="text/plain" name="feedback" id="feedback">
                    <label for="namn">Full name:</label>
                    <input type="text" id="namn" name="namn" placeholder="Ditt namn.." class="box">
                    <input type="text" id="namn" name="namn" placeholder="Ditt namn.." class="box">
                    <p id="namn-error" class="error"></p>

                    <label for="email">Email:</label>
                    <input id="email" name="email" placeholder="namn@mail.com" class="box">
                    <p id="email-error" class="error"></p>


                    <label for="topicofinterest">Choose a topic of interest</label>

                    <select name="topicofinterest" id="topicofinterest" class="box">
                    <select name="topicofinterest" id="topicofinterest" class="box">
                        <option value="" disabled selected>Annledning för kontakt</option>
                        <option value="annanannledning">Annan annledning</option>
                        <option value="kontakt">Komma i kontakt med mig</option>
                        <option value="felpåsida">Bugg på sidan</option>
                        <option value="sammarbete">Sammarbeta med mig</option>
                    </select>
                    <p id="topicofinterest-error" class="error"></p>

                    <label for="comments">Comments:</label>
                    <textarea id="comments" name="comments" placeholder="Type something..." class="box"></textarea>
                    <p id="comments-error" class="error"></p>
                    <div class="counter"> Characters:  <span id="count">0</span></div>
                    
                    <label for="website" >Website (URL)</label>
                    <input type="url" id="website" name="website" class="box">

                    <button type="submit" value="Submit" class="box">Skicka</button>
                    <button type="reset" value="Reset">Clear</button>
                    <p id="status"></p>
                </form>
            </div>
        </section>
        <script src="uppgift2.js"></script>
    </body>
</html>
